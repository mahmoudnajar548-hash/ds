spring.application.name=coursehub
server.port=8080

# --- Database (MySQL) ---
# Secrets are NOT hard-coded: they come from environment variables.
# If the variable is not set, the value after ":" is used as the default.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coursehub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# update = create/alter tables to match the entities, but never delete existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Do not keep the DB session open while the JSON response is written
spring.jpa.open-in-view=false
