# Demo profile: in-memory H2 database, no MySQL installation needed.
# Activate it with --spring.profiles.active=demo (or in your IDE run configuration).
# Data is lost when the application stops. The graded run uses the default MySQL profile.

spring.datasource.url=jdbc:h2:mem:coursehub;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Web console to browse the in-memory database while the app is running:
# http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:mem:coursehub, user: sa, password: empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
