$kind: http-request
url: "{{baseUrl}}/api/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Spring Boot REST APIs",
      "description": "Build a complete REST API with Spring Boot and JPA",
      "price": 49.99,
      "durationHours": 12,
      "level": "INTERMEDIATE",
      "categoryId": {{categoryId}},
      "instructorId": {{instructorId}},
      "tagIds": [{{tagId1}}, {{tagId2}}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      const json = pm.response.json();
      pm.test("Relations are resolved", function () { pm.expect(json.category.id).to.eql(Number(pm.collectionVariables.get("categoryId"))); pm.expect(json.instructor.id).to.eql(Number(pm.collectionVariables.get("instructorId"))); pm.expect(json.tags.length).to.eql(2); });
      pm.collectionVariables.set("courseId", json.id);
    language: text/javascript
order: 5000
