$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Right id returned", function () { pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get("categoryId"))); });
    language: text/javascript
order: 2000
