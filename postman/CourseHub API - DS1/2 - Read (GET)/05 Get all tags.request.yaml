$kind: http-request
url: "{{baseUrl}}/api/tags"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response is a non-empty array", function () { pm.expect(pm.response.json()).to.be.an("array").that.is.not.empty; });
    language: text/javascript
order: 5000
