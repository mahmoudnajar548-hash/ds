$kind: http-request
url: "{{baseUrl}}/api/courses/{{courseId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Spring Boot REST APIs",
      "description": "Build a complete REST API with Spring Boot and JPA",
      "price": 59.99,
      "durationHours": 14,
      "level": "INTERMEDIATE",
      "categoryId": {{categoryId}},
      "instructorId": {{instructorId}},
      "tagIds": [{{tagId1}}, {{tagId2}}]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("Price and duration updated", function () { pm.expect(json.price).to.eql(59.99); pm.expect(json.durationHours).to.eql(14); });
    language: text/javascript
order: 5000
