$kind: http-request
url: "{{baseUrl}}/api/instructors/{{instructorId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Sarah",
      "lastName": "Connor",
      "email": "sarah.{{suffix}}@coursehub.com",
      "bio": "Senior Java developer, 10 years of experience"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("Bio updated", function () { pm.expect(json.bio).to.include("10 years"); });
    language: text/javascript
order: 2000
