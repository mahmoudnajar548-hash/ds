$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () { pm.response.to.have.status(400); });
      const json = pm.response.json();
      pm.test("fieldErrors.name is present", function () { pm.expect(json.fieldErrors).to.have.property("name"); });
    language: text/javascript
order: 4000
