$kind: http-request
url: "{{baseUrl}}/api/categories/999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", function () { pm.response.to.have.status(404); });
      const json = pm.response.json();
      pm.test("Clear message", function () { pm.expect(json.message).to.eql("Category with id 999999 not found"); });
    language: text/javascript
order: 1000
