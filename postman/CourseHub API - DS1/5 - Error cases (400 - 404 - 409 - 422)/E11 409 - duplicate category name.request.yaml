$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Programming & Dev {{suffix}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 409", function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 11000
