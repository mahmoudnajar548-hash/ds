$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Someone Else",
      "email": "student.{{suffix}}@esb.tn"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 409", function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 12000
