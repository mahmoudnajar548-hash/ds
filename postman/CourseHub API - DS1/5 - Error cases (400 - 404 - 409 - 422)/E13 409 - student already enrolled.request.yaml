$kind: http-request
url: "{{baseUrl}}/api/enrollments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentId": {{studentId}},
      "courseId": {{courseId}}
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 409", function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 13000
