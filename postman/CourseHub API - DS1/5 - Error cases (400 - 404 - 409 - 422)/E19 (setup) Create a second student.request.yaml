$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Leila Trabelsi",
      "email": "leila.{{suffix}}@esb.tn"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.response.to.have.status(201); });
      const json = pm.response.json();
      pm.collectionVariables.set("studentBId", json.id);
    language: text/javascript
order: 19000
