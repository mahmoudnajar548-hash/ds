$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Bad Email",
      "email": "not-an-email"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () { pm.response.to.have.status(400); });
      const json = pm.response.json();
      pm.test("fieldErrors.email is present", function () { pm.expect(json.fieldErrors).to.have.property("email"); });
    language: text/javascript
order: 8000
