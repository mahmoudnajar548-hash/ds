$kind: http-request
url: "{{baseUrl}}/api/courses/{{courseId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("1 tag left", function () { pm.expect(pm.response.json().tags.length).to.eql(1); });
    language: text/javascript
order: 2000
