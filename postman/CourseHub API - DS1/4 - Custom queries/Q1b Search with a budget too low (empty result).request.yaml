$kind: http-request
url: "{{baseUrl}}/api/courses/search?keyword=spring&maxPrice=10"
method: GET
queryParams:
  keyword: spring
  maxPrice: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Course is filtered out by price", function () { const id = Number(pm.collectionVariables.get("courseId")); pm.expect(pm.response.json().some(c => c.id === id)).to.be.false; });
    language: text/javascript
order: 2000
