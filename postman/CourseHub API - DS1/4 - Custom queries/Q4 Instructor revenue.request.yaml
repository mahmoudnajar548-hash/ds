$kind: http-request
url: "{{baseUrl}}/api/instructors/{{instructorId}}/revenue"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("Revenue = price of the one enrollment", function () { pm.expect(Number(json.totalRevenue)).to.eql(59.99); });
    language: text/javascript
order: 5000
