$kind: http-request
url: "{{baseUrl}}/api/courses/{{courseId}}/students"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Roster contains our student", function () { const id = Number(pm.collectionVariables.get("studentId")); pm.expect(pm.response.json().some(s => s.id === id)).to.be.true; });
    language: text/javascript
order: 3000
