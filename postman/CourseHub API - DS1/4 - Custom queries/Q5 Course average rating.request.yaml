$kind: http-request
url: "{{baseUrl}}/api/courses/{{courseId}}/rating"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test("1 review, average 4", function () { pm.expect(json.reviewCount).to.eql(1); pm.expect(json.averageRating).to.eql(4); });
    language: text/javascript
order: 6000
